version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: govconnect_postgres
    restart: always
    environment:
      POSTGRES_USER: govconnect
      POSTGRES_PASSWORD: govconnect_password
      POSTGRES_DB: govconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govconnect -d govconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govconnect_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://govconnect:govconnect_password@postgres:5432/govconnect
      - SECRET_KEY=GovBridge-sih-2026-interoperability-super-secret-key
      - BASE_URL=http://backend:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: GovBridge_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
